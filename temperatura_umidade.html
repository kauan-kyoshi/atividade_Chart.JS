<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div>
        <canvas id="myChart"></canvas>
    </div>
</body>
<script>
    const grafico = document.getElementById('myChart');

    new Chart(grafico, {
        type: 'line',
        data: {
            labels: ['13:00','14:00','15:00','16:00','17:00'],
            datasets: [
            {
                label: 'Temperatura',
                data: [30,29,28,25,22,23],
                borderWidth: 2,
                borderColor: 'blue',
                backgroundColor: 'blue'
            },
            
            {
                label: 'Umidade',
                data: [80,82,80,85,80,83],
                borderWidth: 2 ,
                borderColor: 'red',
                backgroundColor: 'red'
            }
            ]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    })
</script>
</html>
