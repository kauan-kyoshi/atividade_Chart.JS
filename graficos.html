<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body{
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: rgba(172, 171, 171, 0.671);
    }

    .graficos{
        width: 90%;   
        
        height: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 50px;

    }
    .graficos p{
        font-family: Arial, Helvetica, sans-serif;
        font-size: 150%;
    }
</style>

</head>
<body>

    <div class="graficos">
        <p>Grafico de linhas:</p>
        <canvas id="myChart"></canvas>
    </div>
    <br><br><br>
    <div class="graficos">
        <p>Grafico de Barras:</p>
        <canvas id="myChart_2" ></canvas>
    </div>
</body>
<script>
    const grafico = document.getElementById('myChart');
    const grafico_2 = document.getElementById('myChart_2');

    new Chart(grafico, {
        type: 'line',
        data: {
            labels: ['12:00','13:00','14:00','15:00','16:00','17:00'],
            datasets: [
            {
                label: 'Temperatura',
                data: [30,29,28,25,22,23],
                borderWidth: 2,
                borderColor: 'blue',
                backgroundColor: 'blue'
            },
            
            {
                label: 'Umidade',
                data: [80,82,80,85,80,83],
                borderWidth: 2 ,
                borderColor: 'red',
                backgroundColor: 'red'
            }
            ]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    })

    new Chart(grafico_2, {
        type: 'bar',
        data: {
            labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'],
            datasets: [
            {
                label: 'Temperatura',
                data:[22,24,27,23,20,18],
                borderWidth: 2,
                borderColor: 'blue',
                backgroundColor: 'blue'
            },
            {
                label: 'Umidade',
                data: [90,89,93,87,88,83],
                borderWidth: 2 ,
                borderColor: 'red',
                backgroundColor: 'red'
            }
            ]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    })
</script>
</html>
